<style>
  :root {
    color-scheme: light;
    --text: #252525;
    --muted: #717182;
    --bg: #F5F6F9;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Oben ein Schimmer des Verlaufs, damit die Seite nicht grau anfaengt. */
  .glow {
    position: fixed;
    inset: 0 0 auto 0;
    height: 520px;
    background:
      radial-gradient(60% 70% at 30% 0%, #60A5FA33, transparent 70%),
      radial-gradient(60% 70% at 75% 10%, #FF6B6B2e, transparent 70%);
    pointer-events: none;
  }

  main {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 72px 16px 40px;
    text-align: center;
  }

  .logo {
    width: 168px;
    height: 168px;
    margin: 0 auto 28px;
    border-radius: 38px;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(96, 120, 200, 0.35), 0 4px 12px rgba(11, 18, 32, 0.12);
  }
  .logo svg { display: block; width: 100%; height: 100%; }

  h1 {
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -1.6px;
    margin: 0 0 14px;
    font-weight: 800;
  }
  .claim {
    font-size: 19px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 auto 36px;
    max-width: 400px;
  }

  a.store {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, #60A5FA, #FF6B6B);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(255, 107, 107, 0.3);
    transition: transform 0.15s ease;
  }
  a.store:active { transform: scale(0.97); }

  .schritte {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 56px 0 0;
    padding: 0;
    list-style: none;
  }
  .schritte li {
    background: var(--surface);
    border-radius: 20px;
    padding: 20px 14px;
    box-shadow: 0 4px 16px rgba(11, 18, 32, 0.06);
  }
  .nr {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60A5FA, #FF6B6B);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    line-height: 32px;
    text-align: center;
  }
  .schritte strong { display: block; font-size: 16px; }

  .rezensionen {
    display: grid;
    gap: 12px;
    margin-top: 48px;
    text-align: left;
  }
  .rezension {
    margin: 0;
    background: var(--surface);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(11, 18, 32, 0.06);
  }
  .sterne { color: #F5A524; font-size: 16px; letter-spacing: 2px; margin-bottom: 8px; }
  .rezension strong { display: block; font-size: 16px; margin-bottom: 6px; }
  .rezension blockquote { margin: 0 0 12px; font-size: 15px; line-height: 1.55; }
  .rezension figcaption { font-size: 13px; color: var(--muted); }

  footer {
    position: relative;
    padding: 24px 16px 32px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }

  @media (max-width: 520px) {
    main { padding-top: 56px; }
    .logo { width: 136px; height: 136px; border-radius: 31px; }
    h1 { font-size: 42px; }
    .claim { font-size: 17px; }
    .schritte { grid-template-columns: 1fr; text-align: left; }
    .schritte li { display: flex; align-items: center; gap: 14px; padding: 16px; }
    .nr { flex: none; margin: 0; }
  }
</style>
</head>

      <blockquote>TripMatch ist eine richtig coole und innovative App! Die Idee, Reiseziele gemeinsam mit Freunden zu entdecken und den nächsten Urlaub unkompliziert zu planen, finde ich einfach genial. Die App macht Lust darauf, neue Orte kennenzulernen, gemeinsam Abenteuer zu erleben und unvergessliche Erinnerungen zu schaffen. Besonders das Konzept, die Reiseplanung mit Freunden zu verbinden, hebt TripMatch von anderen Apps ab. Eine tolle Idee mit viel Potenzial – ich freue mich darauf, die App weiter zu nutzen und kann sie jedem empfehlen, der gerne reist! 🌍✈️</blockquote>
